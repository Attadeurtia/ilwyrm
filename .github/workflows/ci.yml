name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'

      # .env est un asset déclaré dans pubspec mais gitignoré : on en crée un
      # vide pour que le build/test ne cherche pas un fichier absent.
      - name: Create empty .env
        run: echo "GOOGLE_BOOKS_API_KEY=" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
